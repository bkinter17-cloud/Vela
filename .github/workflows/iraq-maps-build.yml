name: Iraq Maps - Build

# Builds a DEBUG APK of Iraq Maps and runs the unit tests. No secrets are needed or used.
# The APK is uploaded as a workflow artifact (Actions run page > Artifacts). Nothing is
# published, released or deployed by this workflow.
on:
  workflow_dispatch:
  push:
    branches: [ feature/iraq-maps ]

permissions:
  contents: read

concurrency:
  group: iraq-maps-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Check the Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # Prebuilt binaries with no Maven artifact. They live on the UPSTREAM Vela releases
      # (GPLv3). Mirror them into this repository's own releases (same tag names) to remove
      # that dependency; each step tries this repository first. See docs/BUILD_ANDROID.md.
      - name: Fetch OsmAnd routing jars
        run: |
          mkdir -p core/libs
          for f in osmand-java.jar osmand-shared-jvm.jar gnu-trove-osmand.jar kxml2-vela.jar; do
            curl -fSL -o "core/libs/$f" "https://github.com/${{ github.repository }}/releases/download/obf-runtime/$f" \
            || curl -fSL -o "core/libs/$f" "https://github.com/PimpinPumpkin/Vela/releases/download/obf-runtime/$f"
          done
          test "$(stat -c%s core/libs/osmand-java.jar)" -gt 10000000
          test "$(stat -c%s core/libs/osmand-shared-jvm.jar)" -gt 1000000
          test "$(stat -c%s core/libs/gnu-trove-osmand.jar)" -gt 100000
          test "$(stat -c%s core/libs/kxml2-vela.jar)" -gt 10000

      - name: Fetch Cronet AAR
        run: |
          v=$(sed -n 's/^vela.cronetVersion=//p' gradle.properties)
          f="app/libs/cronet-$v.aar"
          mkdir -p app/libs
          curl -fSL -o "$f" "https://github.com/${{ github.repository }}/releases/download/cronet-runtime/cronet-$v.aar" \
          || curl -fSL -o "$f" "https://github.com/PimpinPumpkin/Vela/releases/download/cronet-runtime/cronet-$v.aar"
          test "$(stat -c%s "$f")" -gt 10000000

      - name: Fetch TTS AAR
        run: |
          mkdir -p app/libs
          curl -fSL -o app/libs/sherpa-onnx-1.13.3.aar "https://github.com/${{ github.repository }}/releases/download/tts-runtime/sherpa-onnx-1.13.3.aar" \
          || curl -fSL -o app/libs/sherpa-onnx-1.13.3.aar "https://github.com/PimpinPumpkin/Vela/releases/download/tts-runtime/sherpa-onnx-1.13.3.aar"
          test "$(stat -c%s app/libs/sherpa-onnx-1.13.3.aar)" -gt 50000000

      # APK first so a test failure never hides a build that did succeed.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon -PappVersionName=0.1.${{ github.run_number }} -PappVersionCode=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iraq-maps-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Tests run after the APK is saved; a failure here still fails the job (not ignored).
      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
          if-no-files-found: ignore
